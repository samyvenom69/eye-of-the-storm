<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060b19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)" rx="10" />

  <!-- Geometric Accent Lines -->
  <line x1="40" y1="40" x2="200" y2="40" stroke="#0ea5e9" stroke-width="2" stroke-opacity="0.6" />
  <line x1="40" y1="40" x2="40" y2="100" stroke="#0ea5e9" stroke-width="2" stroke-opacity="0.6" />
  <line x1="1160" y1="220" x2="1000" y2="220" stroke="#818cf8" stroke-width="2" stroke-opacity="0.6" />
  <line x1="1160" y1="220" x2="1160" y2="160" stroke="#818cf8" stroke-width="2" stroke-opacity="0.6" />

  <!-- Title & Subtitle -->
  <text x="600" y="95" text-anchor="middle" fill="url(#textGrad)" font-family="&#39;Segoe UI&#39;, Ubuntu, sans-serif" font-size="48" font-weight="900" letter-spacing="3">
    EYE OF THE STORM
  </text>
  <text x="600" y="135" text-anchor="middle" fill="#94a3b8" font-family="&#39;Segoe UI&#39;, Ubuntu, sans-serif" font-size="16" font-weight="400" letter-spacing="1">
    Automated External Attack Surface Management & OSINT Reconnaissance Framework
  </text>

  <!-- 4-Phase Tags -->
  <g transform="translate(235, 175)" font-family="monospace" font-size="12" font-weight="bold">
    <rect x="0" y="0" width="160" height="32" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="80" y="20" text-anchor="middle" fill="#f8fafc">01. RECON</text>

    <rect x="180" y="0" width="170" height="32" rx="4" fill="#1e293b" stroke="#60a5fa" stroke-width="1" />
    <text x="265" y="20" text-anchor="middle" fill="#f8fafc">02. INVESTIGATE</text>

    <rect x="360" y="0" width="160" height="32" rx="4" fill="#1e293b" stroke="#818cf8" stroke-width="1" />
    <text x="440" y="20" text-anchor="middle" fill="#f8fafc">03. ANALYSE</text>

    <rect x="540" y="0" width="180" height="32" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1" />
    <text x="630" y="20" text-anchor="middle" fill="#ecfdf5">04. INTELLIGENCE</text>
  </g>
</svg>
