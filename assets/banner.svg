<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Eye of the Storm banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060a16"/>
      <stop offset="50%" stop-color="#0c142e"/>
      <stop offset="100%" stop-color="#04060d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#155e75" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#glow)"/>

  <!-- subtle grid dots -->
  <g fill="#38bdf8" opacity="0.10">
    <circle cx="80" cy="70" r="1.6"/><circle cx="200" cy="70" r="1.6"/><circle cx="320" cy="70" r="1.6"/>
    <circle cx="880" cy="70" r="1.6"/><circle cx="1000" cy="70" r="1.6"/><circle cx="1120" cy="70" r="1.6"/>
    <circle cx="80" cy="350" r="1.6"/><circle cx="200" cy="350" r="1.6"/><circle cx="320" cy="350" r="1.6"/>
    <circle cx="880" cy="350" r="1.6"/><circle cx="1000" cy="350" r="1.6"/><circle cx="1120" cy="350" r="1.6"/>
  </g>

  <!-- radar rings -->
  <g fill="none" stroke="#22d3ee">
    <circle cx="600" cy="180" r="150" stroke-opacity="0.10" stroke-width="1.5"/>
    <circle cx="600" cy="180" r="110" stroke-opacity="0.16" stroke-width="1.5"/>
    <circle cx="600" cy="180" r="70" stroke-opacity="0.22" stroke-width="1.5"/>
    <circle cx="600" cy="180" r="32" stroke-opacity="0.35" stroke-width="1.5"/>
  </g>
  <!-- radar crosshair -->
  <g stroke="#22d3ee" stroke-opacity="0.25" stroke-width="1">
    <line x1="600" y1="20" x2="600" y2="60"/>
    <line x1="600" y1="300" x2="600" y2="340"/>
    <line x1="440" y1="180" x2="480" y2="180"/>
    <line x1="720" y1="180" x2="760" y2="180"/>
  </g>
  <!-- eye -->
  <circle cx="600" cy="180" r="10" fill="#67e8f9"/>
  <circle cx="600" cy="180" r="18" fill="none" stroke="#a5f3fc" stroke-opacity="0.6" stroke-width="1.5"/>

  <!-- sweep beam -->
  <g transform="rotate(-35 600 180)">
    <line x1="600" y1="180" x2="600" y2="35" stroke="url(#scanGrad)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- blips -->
  <g fill="#4ade80">
    <circle cx="512" cy="130" r="3" opacity="0.9"/>
    <circle cx="672" cy="225" r="3" opacity="0.7"/>
    <circle cx="556" cy="248" r="2.4" opacity="0.8"/>
  </g>

  <!-- title -->
  <text x="600" y="330" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="58" font-weight="bold" letter-spacing="10" fill="url(#titleGrad)">EYE OF THE STORM</text>

  <!-- subtitle -->
  <text x="600" y="368" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="19" letter-spacing="2" fill="#94a3b8">Automated External Attack Surface Management &amp; OSINT Reconnaissance</text>

  <!-- bottom accent -->
  <rect x="350" y="392" width="500" height="2" rx="1" fill="#164e63"/>
  <text x="600" y="408" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="12" letter-spacing="4" fill="#475569">16 MODULES · ASYNCIO · NLP · CTI · ISO 27001 / NIS2 / DORA</text>
</svg>
