<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060b19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Cyan Glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Cyber Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.6" />
    </pattern>
  </defs>

  <!-- Main Background -->
  <rect width="1200" height="320" fill="url(#bg)" rx="12" />
  <rect width="1200" height="320" fill="url(#grid)" rx="12" />
  <circle cx="220" cy="160" r="240" fill="url(#glow)" />

  <!-- Decorative Radar / Eye of the Storm (Left Side) -->
  <g transform="translate(220, 160)">
    <!-- Outer Radar Rings -->
    <circle cx="0" cy="0" r="115" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="8 6" />
    <circle cx="0" cy="0" r="90" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="40 15 10 15" />
    <circle cx="0" cy="0" r="68" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    
    <!-- Crosshairs -->
    <line x1="-130" y1="0" x2="-75" y2="0" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6" />
    <line x1="75" y1="0" x2="130" y2="0" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6" />
    <line x1="0" y1="-130" x2="0" y2="-75" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6" />
    <line x1="0" y1="75" x2="0" y2="130" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6" />

    <!-- Cyber Eye Contour -->
    <path d="M -85 0 Q 0 -65 85 0 Q 0 65 -85 0 Z" fill="#091326" stroke="#38bdf8" stroke-width="2.5" />
    <path d="M -70 0 Q 0 -48 70 0 Q 0 48 -70 0 Z" fill="none" stroke="#818cf8" stroke-width="1" stroke-opacity="0.6" />

    <!-- Iris & Pupil -->
    <circle cx="0" cy="0" r="28" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-dasharray="12 4" />
    <circle cx="0" cy="0" r="14" fill="#38bdf8" />
    <circle cx="-5" cy="-5" r="4" fill="#ffffff" />

    <!-- Threat Nodes -->
    <circle cx="65" cy="-65" r="4" fill="#f43f5e" />
    <line x1="65" y1="-65" x2="95" y2="-85" stroke="#f43f5e" stroke-width="1" />
    <text x="100" y="-82" fill="#f43f5e" font-family="monospace" font-size="10">IOC_DETECTED</text>

    <circle cx="-75" cy="55" r="3.5" fill="#10b981" />
    <line x1="-75" y1="55" x2="-105" y2="75" stroke="#10b981" stroke-width="1" />
    <text x="-165" y="78" fill="#10b981" font-family="monospace" font-size="10">ASSET_MAPPED</text>
  </g>

  <!-- Right Side Typography & Branding -->
  <g transform="translate(410, 0)">
    <!-- Top Tag -->
    <rect x="0" y="55" width="350" height="26" rx="4" fill="#0f172a" stroke="#0ea5e9" stroke-width="1" />
    <text x="14" y="72" fill="#38bdf8" font-family="&#39;Courier New&#39;, monospace" font-size="12" font-weight="bold" letter-spacing="1.5">
      ⚡ EASM & OSINT INTELLIGENCE ENGINE
    </text>

    <!-- Main Title -->
    <text x="0" y="145" fill="url(#textGrad)" font-family="&#39;Segoe UI&#39;, Ubuntu, Sans-Serif" font-size="56" font-weight="900" letter-spacing="3">
      EYE OF THE STORM
    </text>

    <!-- Subtitle -->
    <text x="2" y="182" fill="#94a3b8" font-family="&#39;Segoe UI&#39;, Ubuntu, Sans-Serif" font-size="18" font-weight="400" letter-spacing="0.5">
      Automated Perimeter Reconnaissance, Threat Correlation & Risk Auditing
    </text>

    <!-- 4-Phase Pipeline Badges -->
    <g transform="translate(0, 215)" font-family="&#39;Courier New&#39;, monospace" font-size="13" font-weight="bold">
      <!-- Phase 1 -->
      <rect x="0" y="0" width="130" height="34" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <text x="20" y="21" fill="#f8fafc">01. RECON</text>
      <text x="142" y="22" fill="#38bdf8">➔</text>

      <!-- Phase 2 -->
      <rect x="165" y="0" width="165" height="34" rx="6" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5" />
      <text x="182" y="21" fill="#f8fafc">02. INVESTIGATE</text>
      <text x="342" y="22" fill="#60a5fa">➔</text>

      <!-- Phase 3 -->
      <rect x="365" y="0" width="145" height="34" rx="6" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
      <text x="383" y="21" fill="#f8fafc">03. ANALYSE</text>
      <text x="522" y="22" fill="#818cf8">➔</text>

      <!-- Phase 4 -->
      <rect x="545" y="0" width="175" height="34" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
      <text x="562" y="21" fill="#ecfdf5">04. INTELLIGENCE</text>
    </g>

    <!-- Footer Compliance Line -->
    <text x="2" y="282" fill="#64748b" font-family="&#39;Courier New&#39;, monospace" font-size="12" letter-spacing="1">
      [ PYTHON 3.10+ | ASYNCIO | SPACY NLP | ISO 27001 • DORA • NIS2 READY ]
    </text>
  </g>

  <!-- Outer Border -->
  <rect x="1" y="1" width="1198" height="318" rx="12" fill="none" stroke="#1e293b" stroke-width="2" />
</svg>
